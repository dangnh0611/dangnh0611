name: Update GitHub Stats SVG
on:
  schedule:
    - cron: '0 */3 * * *' # Runs automatically every 3 hours
  workflow_dispatch: # This adds a manual "Run workflow" button in your Actions tab

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVG
        run: |
          curl -s "https://github-readme-stats-git-master-anuraghazra.vercel.app/api?username=dangnh0611&show_icons=true&include_all_commits=true&theme=tokyonight" > stats.svg

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update stats card" && git push)